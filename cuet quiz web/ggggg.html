<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --primary: #002147; --secondary: #007bff; --accent: #28a745; --danger: #f44336; --review: #6a4c93; --bg: #f4f7f9; --white: #ffffff; --card-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; color: #333; overflow-x: hidden; }
        
        /* Compact Nav & Header */
        nav { background: var(--white); padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .nav-brand { font-weight: 800; font-size: 1.3em; color: var(--primary); text-decoration: none; }
        .wa-btn { background: #25D366; color: white !important; padding: 6px 15px; border-radius: 50px; font-weight: 700; text-decoration: none; font-size: 0.8em; }

        header { background: var(--primary); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header h1 { margin: 0; cursor: pointer; font-size: 1.4em; font-weight: 800; }

        .container { flex: 1; padding: 15px 2%; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        /* Compact Motivation Section */
        #home-screen { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; }
        .hero-banner { background: linear-gradient(135deg, var(--primary) 0%, #004080 100%); color: white; padding: 15px 30px; border-radius: 12px; text-align: center; }
        .hero-banner h2 { margin: 0; font-size: 1.2em; font-weight: 800; }
        .hero-banner p { margin: 5px 0 0; font-style: italic; opacity: 0.9; font-size: 0.9em; }

        .section-header { font-size: 1.2em; font-weight: 800; color: var(--primary); border-left: 5px solid var(--secondary); padding-left: 10px; margin: 10px 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .p-card { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: var(--card-shadow); border: 1px solid #f0f2f4; text-align: center; }
        .action-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; }

        /* CBT Mode */
        #exam-screen { display: none; width: 98%; max-width: 1750px; gap: 15px; }
        .main-quiz { flex: 5; background: var(--white); padding: 35px; border-radius: 15px; box-shadow: var(--card-shadow); }
        .sidebar { flex: 1.3; background: var(--white); padding: 20px; border-radius: 15px; min-width: 300px; border: 1px solid #eee; }
        .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 8px; margin-top: 15px; }
        .q-box { width: 45px; height: 45px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; font-weight: 700; font-size: 0.85em; }
        .q-box.active { border: 3px solid var(--secondary); background: #f0f7ff; }
        .q-box.answered { background: var(--accent); color: white; border: none; }
        .q-box.review { background: var(--review); color: white; border: none; }
        .opt-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #f0f0f0; border-radius: 8px; background: #fff; text-align: left; cursor: pointer; font-size: 1.1em; }
        .opt-btn.selected { border-color: var(--secondary); background: #f1f8ff; color: var(--secondary); font-weight: 700; }

        /* Scorecard */
        #result-screen { display: none; width: 95%; max-width: 900px; flex-direction: column; gap: 20px; }
        .result-header { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: var(--card-shadow); }
        .score-box { font-size: 3em; font-weight: 800; color: var(--primary); }

        footer { background: #111; color: #666; text-align: center; padding: 20px; font-size: 0.8em; margin-top: auto; }
        @media (max-width: 1100px) { #exam-screen { flex-direction: column; } .sidebar { order: -1; width: 100%; } }
    </style>
</head>

        </div>
        <div class="sidebar">

        "Set 7": { pass: "1234", msg: motivations[6], questions: [] },
        "Set 8": { pass: "1234", msg: motivations[7], questions: [] },
        "Set 9": { pass: "1234", msg: motivations[8], questions: [] },
        "Set 10": { pass: "1234", msg: motivations[9], questions: [] }
    };

    // Filling in remaining sets to reach 230 questions total [Mocking data for Sets 4-10 for copy-paste]
    for(let s=4; s<=10; s++) {
        quizData[`Set ${s}`] = { pass: "1234", msg: motives[s % motives.length], questions: [] };
        for(let q=1; q<=23; q++) {
            quizData[`Set ${s}`].questions.push({
                q: `Set ${s} Q${q}: Evaluate $\\int_{${q}}^{${q+1}} x dx$.`,
                o: ["Ans A", "Ans B", "Ans C", "Ans D"],
                a: Math.floor(Math.random() * 4)
            });
        }
    }

    let activeSet = null, curr = 0, userAns = [], qStatus = [], timeLeft = 5400;

    function initHome() {
        const grid = document.getElementById("test-grid");
        document.getElementById("home-quote").innerText = `"${motives[Math.floor(Math.random() * motives.length)]}"`;
        Object.keys(quizData).forEach(name => {
            grid.innerHTML += `
                <div class="p-card">
                    <h3>${name}</h3>
                    <p class="desc">MCA Master Set: 40 CS, 23 Math, 12 Reasoning.</p>
                    <button class="action-btn" onclick="openGate('${name}')">Start Practice</button>
                </div>
            `;
        });
    }

    function openGate(name) { activeSet = name; document.getElementById("home-screen").style.display = "none"; document.getElementById("lock-screen").style.display = "block"; }
    function checkAccess() {
        if(document.getElementById("pass-code").value === quizData[activeSet].pass) {
            document.getElementById("lock-screen").style.display = "none"; document.getElementById("exam-screen").style.display = "flex";
            const qCount = quizData[activeSet].questions.length || 75;
            userAns = new Array(qCount).fill(null); qStatus = new Array(qCount).fill('not-visited');
            loadStep(0); setInterval(runClock, 1000);
        } else { alert("Wrong Code!"); }
    }

    function loadStep(i) {
        curr = i; const data = quizData[activeSet].questions[i] || { q: "Questions loading...", o: ["A","B","C","D"], a: 0 };
        document.getElementById("q-label").innerText = `Question ${i+1}`; 
        document.getElementById("q-text").innerHTML = data.q;
        const opts = document.getElementById("opt-container"); opts.innerHTML = "";
        data.o.forEach((txt, idx) => { const cls = (userAns[curr] === idx) ? 'selected' : ''; opts.innerHTML += `<button class="opt-btn ${cls}" onclick="pick(${idx})">${txt}</button>`; });
        renderMathInElement(document.body, { delimiters: [{left: "$", right: "$", display: false}] });
        refreshPalette();
    }

    function refreshPalette() {
        const grid = document.getElementById("palette-grid"), count = quizData[activeSet].questions.length || 75; grid.innerHTML = "";
        for(let i=0; i<count; i++) grid.innerHTML += `<div class="q-box ${qStatus[i]} ${i===curr?'active':''}" onclick="loadStep(${i})">${i+1}</div>`;
    }

    function pick(idx) { userAns[curr] = idx; loadStep(curr); }
    function clearStep() { userAns[curr] = null; qStatus[curr] = 'not-visited'; loadStep(curr); }
    function prevStep() { if(curr > 0) loadStep(curr-1); }
    function nextStep() { if(curr < userAns.length-1) loadStep(curr+1); }
    function markStep() { qStatus[curr] = 'review'; autoMove(); }
    function saveStep() { qStatus[curr] = (userAns[curr] !== null) ? 'answered' : 'not-visited'; autoMove(); }
    function autoMove() { if(curr < userAns.length-1) loadStep(curr+1); else refreshPalette(); }
    function runClock() { timeLeft--; let m = Math.floor(timeLeft/60), s = timeLeft%60; document.getElementById("cbt-timer").innerText = `TIME: ${m}:${s<10?'0'+s:s}`; if(timeLeft <= 0) finalize(); }
    function confirmSubmit() { if(confirm("Submit Final Exam?")) finalize(); }

    function finalize() {
        document.getElementById("exam-screen").style.display = "none"; document.getElementById("result-screen").style.display = "flex";
        let total = 0, correct = 0, wrong = 0, skipped = 0, cs = 0, math = 0, reason = 0;
        userAns.forEach((ans, i) => {
            const actual = quizData[activeSet].questions[i]?.a;
            if(ans === null) skipped++;
            else if(ans === actual) { correct++; total += 4; if(i<40) cs+=4; else if(i<63) math+=4; else reason+=4; }
            else { wrong++; total -= 1; if(i<40) cs-=1; else if(i<63) math-=1; else reason-=1; }
        });
        document.getElementById("final-total").innerText = total; document.getElementById("res-correct").innerText = correct;
        document.getElementById("res-wrong").innerText = wrong; document.getElementById("res-skip").innerText = skipped;
        document.getElementById("result-motive").innerText = quizData[activeSet].msg;
    }
    initHome();
</script>
</body>
</html>
